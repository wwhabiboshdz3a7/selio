# Services locaux pour le mode connecté (API + worker).
# Le mode démonstration de l'application web n'en a pas besoin.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: selio
      POSTGRES_PASSWORD: selio
      POSTGRES_DB: selio
    ports:
      - "5432:5432"
    volumes:
      - selio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - selio_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Stockage des photos : Garage, compatible S3 — POUR LE DÉVELOPPEMENT LOCAL UNIQUEMENT ---
  # (MinIO a cessé de distribuer ses images Docker : Garage le remplace, en local comme en production.)
  # Secrets de dev connus de tous ; en production, deploy/docker-compose.machine.yml avec deploy/.env
  # (docs/STOCKAGE.md, docs/PC-WINDOWS-IA.md).
  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: 5e110de55e110de55e110de55e110de55e110de55e110de55e110de55e110de5
      GARAGE_ADMIN_TOKEN: selio-garage-admin-dev
    ports:
      - "127.0.0.1:3900:3900" # API S3 (STORAGE_ENDPOINT=http://127.0.0.1:3900)
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - selio_garage_meta:/var/lib/garage/meta
      - selio_garage_data:/var/lib/garage/data

  # Prépare Garage (capacité, bucket « selio-photos », clé de dev, CORS pour le site local), puis s'arrête.
  garage-init:
    image: node:22-alpine
    restart: "no"
    command: ["node", "/init/init.mjs"]
    environment:
      GARAGE_ADMIN_TOKEN: selio-garage-admin-dev
      GARAGE_CAPACITY: 10G
      STORAGE_ACCESS_KEY: GK5e110de5e110de5e110de5e1
      STORAGE_SECRET_KEY: 0de5e1100de5e1100de5e1100de5e1100de5e1100de5e1100de5e1100de5e110
      PUBLIC_WEB_URL: http://127.0.0.1:5173
      CORS_EXTRA_ORIGINS: http://localhost:5173
    volumes:
      - ./deploy/garage/init.mjs:/init/init.mjs:ro
    depends_on: [garage]

volumes:
  selio_pg:
  selio_redis:
  selio_garage_meta:
  selio_garage_data:
