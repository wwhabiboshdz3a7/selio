<!doctype html>
<!-- FIXTURE SYNTHÉTIQUE — page de paiement après « Payer » : la banque demande une validation 3-D Secure.
     NON copiée d'une page réelle. Selio ne saisit JAMAIS de code : l'achat attend que le client valide lui-même. -->
<html lang="fr">
<head><meta charset="utf-8"><title>Paiement | Vinted</title></head>
<body>
  <header>
    <a href="/" aria-label="Accueil">Vinted</a>
    <button data-testid="header--user-menu" aria-label="Mon compte">Mon compte</button>
  </header>
  <main data-testid="checkout" data-item-id="5012345601">
    <h1>Paiement</h1>
    <section data-testid="checkout-summary">
      <div data-testid="checkout-total"><span>Total</span> <span>22,48 €</span></div>
    </section>
    <button type="button" data-testid="checkout-pay-button" disabled>Payer</button>
  </main>
  <div data-testid="three-d-secure" role="dialog" aria-modal="true" aria-labelledby="tds-title">
    <h2 id="tds-title">Authentification 3-D Secure</h2>
    <p>Ta banque demande une confirmation. Valide le paiement dans l'application de ta banque.</p>
    <iframe name="three-ds-challenge" title="3-D Secure" src="https://acs.banque.example.invalid/3ds/challenge?session=EXEMPLE" width="400" height="500"></iframe>
  </div>
</body>
</html>
