# Branche « demo » : démonstration Selio prête à publier.
# Le site est déjà construit dans le dossier demo/ : Netlify le publie tel quel,
# sans installation de dépendances, sans build et sans fonctions serveur.
# Redirections et en-têtes de sécurité : demo/_redirects et demo/_headers.
[build]
  base = "demo"
  publish = "."
  command = "echo 'Démo statique déjà construite : rien à compiler'"
