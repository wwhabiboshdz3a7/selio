# Déploiement Netlify des DEUX sites web (apps/web), avec ce même fichier :
#   - site public (vitrine + application des clients) : VITE_APP_TARGET=public (ou absente) ;
#   - site Selio Admin (administration seule, non indexé) : VITE_APP_TARGET=admin.
# La cible et l'adresse de l'API se règlent dans les variables de chaque projet Netlify (jamais ici) :
#   VITE_APP_TARGET, VITE_API_BASE_URL (l'adresse du site lui-même : /api/* est relayé plus bas).
# La cible « public » construit aussi l'extension Chrome, servie en /extension/selio-extension.zip ;
# la cible « admin » écrit un fichier _headers (X-Robots-Tag: noindex, nofollow) et un robots.txt « Disallow: / ».
# L'API et le worker se déploient séparément (voir docs/DEPLOYMENT.md).
[build]
  base = "/"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build:site"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"
  # Production : VITE_API_BASE_URL est OBLIGATOIRE (vide = démonstration seule, réservée au développement).
  # VITE_API_BASE_URL = "https://seliovprod.netlify.app"

# API Selio (PC de production) relayée par le tunnel : même origine pour les cookies.
# À mettre à jour quand l'adresse du tunnel change.
[[redirects]]
  from = "/api/*"
  to = "https://desktop-optltih.tailf78008.ts.net/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CSP : script et iframes de Revolut Checkout (formulaire de paiement) autorisés depuis les deux hôtes
# Revolut (production et bac à sable) ; wss: pour la fenêtre de connexion de Selio Cloud (WebSocket de l'API) ;
# tout le reste reste limité au site lui-même.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://merchant.revolut.com https://sandbox-merchant.revolut.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src https://merchant.revolut.com https://sandbox-merchant.revolut.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    # Publicité et mesure (docs/VITRINE.md, « Publicité ») : AUCUN hôte de Google ni de Meta n'est autorisé
    # tant qu'aucun identifiant n'est fourni (VITE_GA4_ID, VITE_GOOGLE_ADS_ID, VITE_META_PIXEL_ID vides par défaut).
    # Le jour où un identifiant est renseigné dans Netlify, remplacer la ligne ci-dessus par celle-ci
    # (et la même dans deploy/netlify/_headers), en retirant les hôtes Meta si seul Google est utilisé, ou l'inverse :
    # Content-Security-Policy = "default-src 'self'; script-src 'self' https://merchant.revolut.com https://sandbox-merchant.revolut.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.fr https://www.facebook.com; connect-src 'self' https: wss:; frame-src https://merchant.revolut.com https://sandbox-merchant.revolut.com https://td.doubleclick.net https://www.googletagmanager.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    # Le build prévient (avertissement) si un identifiant est fourni alors que la CSP ne l'autorise pas.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Extension Chrome à télécharger (site public) : toujours la dernière version construite.
[[headers]]
  for = "/extension/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
