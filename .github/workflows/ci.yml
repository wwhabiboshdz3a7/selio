name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: selio, POSTGRES_PASSWORD: selio, POSTGRES_DB: selio_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U selio" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Bases de test (une par projet d'intégration)
        run: |
          PGPASSWORD=selio psql -h 127.0.0.1 -U selio -d selio_test -c "create database selio_test_api owner selio" -c "create database selio_test_worker owner selio"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright (démonstration)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
