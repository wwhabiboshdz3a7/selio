# Garage (stockage des photos, compatible S3) : un seul nœud sur la machine de production.
# Aucun secret ici : GARAGE_RPC_SECRET et GARAGE_ADMIN_TOKEN viennent de deploy/.env (docker-compose.machine.yml).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Doit être identique à STORAGE_REGION (la région fait partie de la signature des URLs)
s3_region = "fr-mrs-1"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.selio.invalid"

[admin]
# Joignable uniquement sur le réseau interne de Docker (aucun port publié) : sert à l'initialisation
api_bind_addr = "0.0.0.0:3903"
