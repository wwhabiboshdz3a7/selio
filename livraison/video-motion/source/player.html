<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Selio motion</title><link rel="stylesheet" href="style.css"></head>
<body><div id="stage"></div>
<script src="engine.js"></script>
<script src="videos/modules.js"></script>
<script src="videos/marque.js"></script>
<script>
  /* ?v=<id>&fmt=9x16|16x9|1x1 (&play=1 : lecture en temps réel) */
  const q = new URLSearchParams(location.search);
  const dur = SELIO.mount(q.get("v") || Object.keys(SELIO.videos)[0], q.get("fmt") || "9x16");
  if (q.get("play")) { const t0 = performance.now(); (function loop() { SELIO.seek(((performance.now() - t0) / 1000) % dur); requestAnimationFrame(loop); })(); }
</script></body></html>
